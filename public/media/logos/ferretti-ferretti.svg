    <rect width="48" height="48" rx="4" fill="#2b2824"/>
    <!-- F sinistra (specchiata) -->
    <path d="M22 14 H12 V34 H15 V25 H21 V22 H15 V17 H22 V14 Z" fill="#faf7f2"/>
